<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card ES13 — Rendimiento de Venta Flash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e2dfd7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ── Card ────────────────────────────────────────────────────
       920×920, warm cream, 34px radius
    ─────────────────────────────────────────────────────────── */
    .card {
      width: 920px;
      min-height: 920px;
      max-width: 100%;
      background: #F7F5F0;
      border-radius: 34px;
      padding: 52px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
    }

    /* ── Header: title left + Klaviyo logo right ─────────────── */
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 40px;
    }

    .card-title {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-size: 72px;
      font-weight: 500;
      line-height: 0.92;
      letter-spacing: -2px;
      color: #050505;
    }

    /* Klaviyo logo */
    .klaviyo-logo {
      flex-shrink: 0;
      padding-top: 10px;
      display: inline-flex;
      align-items: flex-start;
      gap: 3px;
    }

    .kl-word {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      color: #111;
      letter-spacing: -1.5px;
      line-height: 1;
    }

    .kl-flag {
      margin-top: -2px;
      flex-shrink: 0;
    }

    /* ── Metric row ──────────────────────────────────────────── */
    .metric-row {
      display: flex;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 44px;
    }

    .main-number {
      font-size: 88px;
      font-weight: 600;
      letter-spacing: -4px;
      color: #050505;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .metric-pct {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 28px;
      font-weight: 600;
      color: #3A9D57;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    /* ── Chart section ───────────────────────────────────────── */
    .chart-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 22px;
    }

    /* Canvas: fixed height, bars positioned inside */
    .chart-canvas {
      position: relative;
      height: 295px;
      flex-shrink: 0;
    }

    /* Row of bars, aligned to bottom of canvas */
    .bars-row {
      position: absolute;
      bottom: 1px; /* sit on baseline */
      left: 0;
      display: flex;
      align-items: flex-end;
      gap: 48px;
    }

    /* Each bar column wrapper */
    .bar-wrap {
      position: relative;
      width: 58px;
      height: 295px;
      flex-shrink: 0;
    }

    /* Segments — absolutely positioned, grow via JS */
    .seg {
      position: absolute;
      left: 0;
      width: 100%;
    }

    .seg-sessions {
      bottom: 0;
      background: #4CA060;
      border-radius: 0;
      height: 0;
    }

    .seg-revenue {
      background: #C7DDBA;
      border-radius: 6px 6px 0 0;
      height: 0;
      /* bottom updated dynamically by JS */
    }

    /* Baseline */
    .baseline {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0,0,0,0.12);
    }

    /* Day labels below bars */
    .labels-row {
      display: flex;
      gap: 48px;
      margin-top: 11px;
    }

    .day-label {
      width: 58px;
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      color: #1d1d1d;
      flex-shrink: 0;
      user-select: none;
    }

    /* ── Legend ─────────────────────────────────────────────── */
    .legend-row {
      display: flex;
      align-items: center;
      gap: 90px;
      margin-bottom: 28px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-sq {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .legend-label {
      font-size: 18px;
      font-weight: 500;
      color: #222;
    }

    /* ── Divider ─────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: rgba(0,0,0,0.10);
      margin-bottom: 28px;
    }

    /* ── CTA section ─────────────────────────────────────────── */
    .cta-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transform: translateY(8px);
    }

    .cta-left {
      font-size: 28px;
      font-weight: 500;
      color: #050505;
      letter-spacing: -0.5px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #DCEAD2;
      color: #3A9D57;
      border: none;
      border-radius: 14px;
      padding: 14px 26px;
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.3px;
      cursor: pointer;
      line-height: 1;
    }
    html,body{background:transparent!important;}
</style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="card-header">
    <div class="card-title">
      Venta Flash<br>Rendimiento
    </div>
    <!-- Klaviyo logo inline -->
    <div class="klaviyo-logo">
      <span class="kl-word">klaviyo</span>
      <svg class="kl-flag" viewBox="0 0 20 16" width="15" height="12">
        <polygon points="0,0 20,0 20,16 10,9 0,16" fill="#111"/>
      </svg>
    </div>
  </div>

  <!-- Metric row -->
  <div class="metric-row">
    <div class="main-number">€<span id="main-val">0</span></div>
    <div class="metric-pct">
      <span>↗</span>
      +<span id="pct-val">0</span>%
    </div>
  </div>

  <!-- Chart section -->
  <div class="chart-section">
    <div class="chart-canvas">
      <div class="bars-row" id="bars-row"></div>
      <div class="baseline"></div>
    </div>
    <div class="labels-row" id="labels-row"></div>
  </div>

  <!-- Legend -->
  <div class="legend-row">
    <div class="legend-item">
      <div class="legend-sq" style="background:#4CA060"></div>
      <span class="legend-label">Sesiones</span>
    </div>
    <div class="legend-item">
      <div class="legend-sq" style="background:#C7DDBA"></div>
      <span class="legend-label">Ingresos</span>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- CTA -->
  <div class="cta-section" id="cta">
    <div class="cta-left">Conversión Máxima: 6.2%</div>
    <button class="cta-btn">Conversión Máxima &nbsp;↗</button>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   BAR DATA
════════════════════════════════════════════════════════════════ */
const BARS = [
  { day: 'Lun', sessions: 120, revenue:  55 },
  { day: 'Mar', sessions: 122, revenue:  70 },
  { day: 'Mié', sessions: 138, revenue:  72 },
  { day: 'Jue', sessions: 150, revenue:  70 },
  { day: 'Vie', sessions: 168, revenue:  72 },
  { day: 'Sáb', sessions: 205, revenue:  80 },
  { day: 'Dom', sessions: 125, revenue:  75 },
];

const BAR_DELAYS = [100, 180, 260, 340, 420, 500, 580];  // ms
const BAR_DUR    = 1200;
const REV_OFFSET =  120;   // revenue starts 120ms after sessions

/* ═══════════════════════════════════════════════════════════════
   BUILD BARS + LABELS
════════════════════════════════════════════════════════════════ */
const barsRow   = document.getElementById('bars-row');
const labelsRow = document.getElementById('labels-row');
const sessEls   = [];
const revEls    = [];

BARS.forEach((bar) => {
  /* Bar wrapper */
  const wrap = document.createElement('div');
  wrap.className = 'bar-wrap';

  const sess = document.createElement('div');
  sess.className = 'seg seg-sessions';

  const rev = document.createElement('div');
  rev.className = 'seg seg-revenue';
  rev.style.bottom = '0px';

  wrap.append(sess, rev);
  barsRow.appendChild(wrap);
  sessEls.push(sess);
  revEls.push(rev);

  /* Label */
  const lbl = document.createElement('div');
  lbl.className = 'day-label';
  lbl.textContent = bar.day;
  labelsRow.appendChild(lbl);
});

/* ═══════════════════════════════════════════════════════════════
   ANIMATION ENGINE
════════════════════════════════════════════════════════════════ */
const MAIN_TARGET = 24820;    // €24,820 shown as 28,420 — adjust to spec
const MAIN_TARGET_DISPLAY = 28420;
const PCT_TARGET  = 52;

const T_BAR_LAST = BAR_DELAYS[6] + REV_OFFSET + BAR_DUR; // 580+120+1200 = 1900ms
const T_MAIN_DUR = 1800;
const T_PCT_DUR  = 1400;
const T_PCT_DEL  =  200;
const T_CTA_DEL  = 1000;
const T_CTA_DUR  =  500;

const T_ANIM = Math.max(T_BAR_LAST, T_MAIN_DUR);  // 1900ms
const T_HOLD = 1800;
const T_LOOP = T_ANIM + T_HOLD;                    // 3700ms

const easeOut3 = p => 1 - Math.pow(1 - p, 3);

const mainEl = document.getElementById('main-val');
const pctEl  = document.getElementById('pct-val');
const ctaEl  = document.getElementById('cta');

function fmtMain(n) {
  return Math.round(n).toLocaleString('en-US');
}

let t0 = null;

function tick(ts) {
  if (!t0) t0 = ts - Math.floor(Math.random() * T_LOOP);
  const t = (ts - t0) % T_LOOP;

  if (t <= T_ANIM) {

    /* Main counter €28,420 */
    const pm = easeOut3(Math.min(t / T_MAIN_DUR, 1));
    mainEl.textContent = fmtMain(MAIN_TARGET_DISPLAY * pm);

    /* +52% counter */
    const ep = Math.max(0, t - T_PCT_DEL);
    const pp = easeOut3(Math.min(ep / T_PCT_DUR, 1));
    pctEl.textContent = Math.round(PCT_TARGET * pp);

    /* Stacked bars */
    BARS.forEach((bar, i) => {
      const e1 = Math.max(0, t - BAR_DELAYS[i]);
      const e2 = Math.max(0, t - BAR_DELAYS[i] - REV_OFFSET);
      const pS = easeOut3(Math.min(e1 / BAR_DUR, 1));
      const pR = easeOut3(Math.min(e2 / BAR_DUR, 1));
      const hS = bar.sessions * pS;
      const hR = bar.revenue  * pR;
      sessEls[i].style.height = hS.toFixed(1) + 'px';
      revEls[i].style.height  = hR.toFixed(1) + 'px';
      revEls[i].style.bottom  = hS.toFixed(1) + 'px';
    });

    /* CTA fade-in at t=1000ms */
    const ec = Math.max(0, t - T_CTA_DEL);
    const pc = easeOut3(Math.min(ec / T_CTA_DUR, 1));
    ctaEl.style.opacity   = pc;
    ctaEl.style.transform = `translateY(${(8 * (1 - pc)).toFixed(2)}px)`;

  } else {

    /* Hold at final values */
    mainEl.textContent = fmtMain(MAIN_TARGET_DISPLAY);
    pctEl.textContent  = PCT_TARGET;
    BARS.forEach((bar, i) => {
      sessEls[i].style.height = bar.sessions + 'px';
      revEls[i].style.height  = bar.revenue  + 'px';
      revEls[i].style.bottom  = bar.sessions + 'px';
    });
    ctaEl.style.opacity   = 1;
    ctaEl.style.transform = 'translateY(0)';
  }

  requestAnimationFrame(tick);
}

document.fonts.ready.then(() => requestAnimationFrame(tick));
</script>

</body>
</html>
