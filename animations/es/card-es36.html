<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koven Growth — Abandono de Carrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050607;
  font-family: 'Inter', sans-serif;
}

/* ── Card ── */
.card {
  width: 640px;
  height: 590px;
  background: #101314;
  border-radius: 26px;
  border: 1px solid rgba(255,255,255,0.10);
  padding: 38px 48px 32px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.40);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Title ── */
h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: 54px;
  line-height: 1.02;
  letter-spacing: -1.4px;
  color: #F4F2EA;
  flex-shrink: 0;
}

.green { color: #35D843; }

/* ── Subtitle ── */
.subtitle {
  font-size: 23px;
  line-height: 1.35;
  font-weight: 400;
  color: rgba(255,255,255,0.58);
  margin-top: 20px;
  max-width: 440px;
  flex-shrink: 0;
}

/* ── Metric ── */
.metric-section {
  margin-top: 30px;
  flex-shrink: 0;
}

.metric-label {
  font-size: 22px;
  color: rgba(255,255,255,0.58);
  margin-bottom: 6px;
}

.metric-row {
  display: flex;
  align-items: center;
}

.metric-value {
  font-size: 52px;
  font-weight: 400;
  letter-spacing: -1.8px;
  color: #F5F5F2;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.metric-badge {
  background: rgba(36,184,68,0.16);
  color: #55E85B;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 20px;
  font-weight: 600;
  line-height: 1;
  margin-left: 14px;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.metric-sub {
  font-size: 22px;
  color: rgba(255,255,255,0.50);
  margin-top: 4px;
}

/* ── Chart ── */
.chart-wrap {
  margin-top: auto;
  flex-shrink: 0;
  width: 100%;
  height: 185px;
  filter: drop-shadow(0 0 16px rgba(93,219,97,0.12));
}

.chart-svg {
  width: 100%;
  height: 100%;
  display: block;
}
  html,body{background:transparent!important;}
</style>
</head>
<body>
<div class="card">

  <h1>Tu Carrito Está Lleno.<br>Tus Ingresos No<span class="green">.</span></h1>

  <p class="subtitle">Recupera a los clientes que ya estaban listos para comprar.</p>

  <div class="metric-section">
    <div class="metric-label">Abandono de Carrito</div>
    <div class="metric-row">
      <span class="metric-value" id="metricValue">€0</span>
      <span class="metric-badge" id="metricBadge">↑ 0%</span>
    </div>
    <div class="metric-sub">vs últimos 30 días</div>
  </div>

  <div class="chart-wrap">
    <svg class="chart-svg" viewBox="0 0 544 185">
      <defs>
        <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#5DDB61" stop-opacity="1"/>
          <stop offset="55%"  stop-color="#2FA943" stop-opacity="1"/>
          <stop offset="100%" stop-color="#2FA943" stop-opacity="0.12"/>
        </linearGradient>
      </defs>

      <!-- Grid lines — positions match toY(30,20,10,0) with Y_MAX=32, PB=145, PT=8, PH=137 -->
      <g id="grid" opacity="0">
        <line x1="50" y1="16"  x2="540" y2="16"  stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="50" y1="59"  x2="540" y2="59"  stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="50" y1="102" x2="540" y2="102" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="50" y1="145" x2="540" y2="145" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
      </g>

      <!-- Y labels -->
      <g id="yLabels" opacity="0"
         font-family="Inter,sans-serif" font-size="17" fill="rgba(255,255,255,0.55)"
         text-anchor="end">
        <text x="44" y="16"  dominant-baseline="middle">30K</text>
        <text x="44" y="59"  dominant-baseline="middle">20K</text>
        <text x="44" y="102" dominant-baseline="middle">10K</text>
        <text x="44" y="145" dominant-baseline="middle">0</text>
      </g>

      <!-- Bars (injected by JS) -->
      <g id="bars"/>

      <!-- X labels (injected by JS) -->
      <g id="xLabels" opacity="0"
         font-family="Inter,sans-serif" font-size="17" fill="rgba(255,255,255,0.50)"
         text-anchor="middle"/>
    </svg>
  </div>

</div>
<script>
/* ── Data ── */
const DATA   = [6,9,13,10,14,15,9,12,16,13,22,12,17,11,15,12,20,23,22,15,18,24,22,18,30,22,27,24,32,21,25];
const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun'];
const N = DATA.length; /* 31 */

/* ── Geometry ── */
const PL    = 48;
const PB    = 145;
const PT    = 8;
const PH    = PB - PT;  /* 137 */
const Y_MAX = 32;
const BAR_W = 11;
const GAP   = 5;
const PER   = BAR_W + GAP; /* 16 */

function barX(i) { return PL + i * PER; }
function toY(v)  { return PB - (v / Y_MAX) * PH; }

/* ── Rounded-top rect path ── */
function roundedTopRect(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M ${x},${y+h} L ${x},${y+r} Q ${x},${y} ${x+r},${y} `
       + `L ${x+w-r},${y} Q ${x+w},${y} ${x+w},${y+r} L ${x+w},${y+h} Z`;
}

/* ── Build bars ── */
const barsG  = document.getElementById('bars');
const barEls = DATA.map((v, i) => {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  el.setAttribute('fill', 'url(#barGrad)');
  el.setAttribute('d', '');
  el.style.opacity = '0';
  barsG.appendChild(el);
  return { el, bx: barX(i), fh: PB - toY(v) };
});

/* ── Build X labels ── */
const xLabels = document.getElementById('xLabels');
MONTHS.forEach((m, mi) => {
  const from = Math.round( mi      * N / 6);
  const to   = Math.round((mi + 1) * N / 6) - 1;
  const midI = (from + to) / 2;
  const cx   = barX(midI) + BAR_W / 2;
  const t    = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', cx.toFixed(1));
  t.setAttribute('y', '172');
  t.textContent = m;
  xLabels.appendChild(t);
});

/* ── Easing: cubic-bezier(0.22, 1, 0.36, 1) ── */
function makeCubicBezier(x1, y1, x2, y2) {
  function A(a1, a2) { return 1 - 3*a2 + 3*a1; }
  function B(a1, a2) { return 3*a2 - 6*a1; }
  function C(a1)     { return 3*a1; }
  function calc(t, a1, a2) { return ((A(a1,a2)*t + B(a1,a2))*t + C(a1))*t; }
  function slp(t, a1, a2)  { return 3*A(a1,a2)*t*t + 2*B(a1,a2)*t + C(a1); }
  function getTForX(x) {
    let t = x;
    for (let i = 0; i < 8; i++) {
      const s = slp(t, x1, x2);
      if (Math.abs(s) < 1e-6) break;
      t -= (calc(t, x1, x2) - x) / s;
    }
    return t;
  }
  return x => (x <= 0) ? 0 : (x >= 1) ? 1 : calc(getTForX(x), y1, y2);
}
const ease = makeCubicBezier(0.22, 1, 0.36, 1);

/* ── Utils ── */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function tween(from, to, dur, onUpdate) {
  return new Promise(resolve => {
    const s = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - s) / dur);
      const e = ease(p);
      onUpdate(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
      else { onUpdate(to); resolve(); }
    })(performance.now());
  });
}

/* ── €26,500 formatter ── */
function fmtEuro(v) {
  const n = Math.round(v);
  const s = String(n);
  return '€' + (s.length > 3 ? s.slice(0, -3) + ',' + s.slice(-3) : s);
}

/* ── Animate one bar ── */
function animateBar(b, delay) {
  return (async () => {
    await sleep(delay);
    return tween(0, b.fh, 1150, h => {
      b.el.style.opacity = Math.min(1, h / (b.fh * 0.12)).toFixed(3);
      b.el.setAttribute('d', roundedTopRect(b.bx, PB - h, BAR_W, h, 3));
    });
  })();
}

/* ── Reset ── */
function resetState() {
  document.getElementById('metricValue').textContent = '€0';
  document.getElementById('metricBadge').textContent = '↑ 0%';
  document.getElementById('grid').style.opacity    = '0';
  document.getElementById('yLabels').style.opacity = '0';
  document.getElementById('xLabels').style.opacity = '0';
  barEls.forEach(b => {
    b.el.setAttribute('d', '');
    b.el.style.opacity = '0';
  });
}

/* ── One cycle ── */
async function runCycle() {
  resetState();
  await sleep(50);

  /* Grid + labels fade */
  tween(0, 1, 500, v => {
    document.getElementById('grid').style.opacity    = v;
    document.getElementById('yLabels').style.opacity = v;
    document.getElementById('xLabels').style.opacity = v;
  });

  /* €0 → €26,500 */
  const p1 = tween(0, 26500, 1600, v =>
    (document.getElementById('metricValue').textContent = fmtEuro(v)));

  /* ↑ 0% → ↑ 45% (delay 200ms) */
  const p2 = (async () => {
    await sleep(200);
    return tween(0, 45, 1200, v =>
      (document.getElementById('metricBadge').textContent = '↑ ' + Math.round(v) + '%'));
  })();

  /* Bars — stagger 35ms */
  const barPs = barEls.map((b, i) => animateBar(b, i * 35));

  await Promise.all([p1, p2, ...barPs]);
}

/* ── Loop ── */
async function loop() {
  await sleep(350);
  while (true) {
    await runCycle();
    await sleep(1400);
  }
}

setTimeout(loop, Math.floor(Math.random() * 4000));
</script>
</body>
</html>
