<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koven Growth — Abandono en el Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050607;
  font-family: 'Inter', sans-serif;
}

/* ── Card ── */
.card {
  width: 640px;
  height: 445px;
  background: #101314;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.10);
  padding: 34px 38px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.40);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Title ── */
h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: 41px;
  line-height: 1.02;
  letter-spacing: -1.2px;
  color: #F4F2EA;
  max-width: 560px;
  flex-shrink: 0;
}

.green { color: #55E85B; }

/* ── Subtitle ── */
.subtitle {
  font-size: 20px;
  line-height: 1.35;
  color: rgba(255,255,255,0.58);
  margin-top: 22px;
  flex-shrink: 0;
}

/* ── Bottom row: 3-column grid ── */
/* Inner width = 640 - 2×38 = 564px
   172 + 20 + (564-172-152-40) + 20 + 152 = 172 + 20 + 200 + 20 + 152 = 564 ✓ */
.bottom-row {
  display: grid;
  grid-template-columns: 172px 1fr 152px;
  column-gap: 20px;
  margin-top: 28px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* ── Left metrics ── */
.metrics { padding-top: 4px; overflow: hidden; }

.metric-label {
  font-size: 17px;
  color: rgba(255,255,255,0.55);
}

.metric-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 1px;
}

.metric-value {
  font-size: 40px;
  font-weight: 400;
  letter-spacing: -1.8px;
  color: #F5F5F2;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.metric-value.red { color: #FF4D55; }

.badge-red {
  background: rgba(255,77,85,0.14);
  color: #FF5A61;
  border-radius: 8px;
  padding: 5px 9px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.metric-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.48);
  margin-top: 2px;
}

.metric-sep {
  width: 150px;
  height: 1px;
  background: rgba(255,255,255,0.14);
  margin: 13px 0;
}

/* ── Donut ── */
/* viewBox 200×200 rendered at 190px → scale 0.95 */
.donut-wrap {
  width: 190px;
  height: 190px;
  margin: 0 auto;
}

.donut-svg { width: 190px; height: 190px; display: block; }

/* ── Legend ── */
.legend { padding-top: 4px; overflow: hidden; }

.legend-item {
  display: flex;
  align-items: flex-start;
  gap: 9px;
}

.legend-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
  opacity: 0;
  transform: scale(0.6);
}

.legend-content { display: flex; flex-direction: column; gap: 2px; }

.legend-value {
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -1px;
  color: #F5F5F2;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.legend-label {
  font-size: 14px;
  line-height: 1.25;
  color: rgba(255,255,255,0.55);
}

.legend-sep {
  width: 138px;
  height: 1px;
  background: rgba(255,255,255,0.14);
  margin: 9px 0;
}
  html,body{background:transparent!important;}
</style>
</head>
<body>
<div class="card">

  <h1>Tus Clientes Se Van En Algún Punto<span class="green">.</span></h1>

  <p class="subtitle">Encontramos exactamente dónde se van y por qué.</p>

  <div class="bottom-row">

    <!-- Left metrics -->
    <div class="metrics">
      <div class="metric-label">Tasa de Conversión</div>
      <span class="metric-value" id="crValue">0.0%</span>
      <div style="margin-top:5px;"><span class="badge-red" id="crBadge">↓ 0%</span></div>
      <div class="metric-sub" style="margin-top:3px;">vs últimos 30 días</div>

      <div class="metric-sep"></div>

      <div class="metric-label">Abandono en Checkout</div>
      <div class="metric-row">
        <span class="metric-value red" id="doValue">0%</span>
      </div>
      <div class="metric-sub">vs últimos 30 días</div>
    </div>

    <!-- Donut
         viewBox 0 0 200 200 · cx=100 cy=100 r=76 stroke-width=24
         Angles (standard math/SVG, 0°=right, clockwise):
           Green: -90° → 82.8°  (172.8° = 48%)  right side + top
           Red:   82.8° → 234°  (151.2° = 42%)  bottom
           Gray:  234° → 270°   (36°    = 10%)  upper-left
    -->
    <div class="donut-wrap">
      <svg class="donut-svg" viewBox="0 0 200 200">

        <!-- Base ring (full circle) -->
        <circle id="bgRing" cx="100" cy="100" r="76"
          fill="none" stroke="#2B2D2F" stroke-width="24" opacity="0"/>

        <!-- Segments — animated via describeArc(endAngle) -->
        <path id="greenSeg" fill="none" stroke="#5DDB61"  stroke-width="24" stroke-linecap="butt" d=""/>
        <path id="redSeg"   fill="none" stroke="#FF414D"  stroke-width="24" stroke-linecap="butt" d=""/>
        <path id="graySeg"  fill="none" stroke="#5B5B5B"  stroke-width="24" stroke-linecap="butt" d=""/>

        <!-- Center text -->
        <g id="centerText" opacity="0">
          <text x="100" y="72"
            font-family="Inter,sans-serif" font-size="14" font-weight="400"
            fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="middle">Abandono</text>
          <text x="100" y="88"
            font-family="Inter,sans-serif" font-size="14" font-weight="400"
            fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="middle">en Checkout</text>
          <text x="100" y="116"
            font-family="Inter,sans-serif" font-size="38" font-weight="400"
            letter-spacing="-1.5" fill="#FF4D55" text-anchor="middle" dominant-baseline="middle">42%</text>
          <text x="100" y="136"
            font-family="Inter,sans-serif" font-size="16" font-weight="600"
            fill="#FF5A61" text-anchor="middle" dominant-baseline="middle">↓ 8%</text>
        </g>

      </svg>
    </div>

    <!-- Right legend -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" id="dot1" style="background:#5DDB61"></div>
        <div class="legend-content">
          <div class="legend-value" id="leg1">0%</div>
          <div class="legend-label">Compra<br>Completada</div>
        </div>
      </div>

      <div class="legend-sep"></div>

      <div class="legend-item">
        <div class="legend-dot" id="dot2" style="background:#FF414D"></div>
        <div class="legend-content">
          <div class="legend-value" id="leg2">0%</div>
          <div class="legend-label">Abandono<br>en Checkout</div>
        </div>
      </div>

    </div>

  </div>
</div>
<script>
/* ── Arc path helpers ── */
function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

/* Returns SVG "d" for a clockwise arc from startAngle to endAngle.
   Angles are standard (0°=3 o'clock, clockwise). */
function describeArc(cx, cy, r, startAngle, endAngle) {
  const span = endAngle - startAngle;
  if (span < 0.01) return '';
  const s = polarToCartesian(cx, cy, r, startAngle);
  const e = polarToCartesian(cx, cy, r, endAngle);
  const large = span > 180 ? 1 : 0;
  return `M ${s.x.toFixed(3)} ${s.y.toFixed(3)} A ${r} ${r} 0 ${large} 1 ${e.x.toFixed(3)} ${e.y.toFixed(3)}`;
}

/* ── Segment start/end angles ── */
/*  -90° = 12 o'clock (top)
    Green  48% → 172.8°: from -90 to  82.8  (top → right side)
    Red    42% → 151.2°: from 82.8 to 234    (right-bottom → lower-left via bottom)
    Gray   10% →  36°:   from 234  to 270    (lower-left → back to top)       */
const CX = 100, CY = 100, R = 76;
const G_S = -90,  G_E = 82.8;
const R_S = 82.8, R_E = 234;
const S_S = 234,  S_E = 270;

/* ── Refs ── */
const bgRing     = document.getElementById('bgRing');
const greenSeg   = document.getElementById('greenSeg');
const redSeg     = document.getElementById('redSeg');
const graySeg    = document.getElementById('graySeg');
const centerText = document.getElementById('centerText');

/* ── Easing: cubic-bezier(0.22, 1, 0.36, 1) ── */
function makeCubicBezier(x1, y1, x2, y2) {
  function A(a1, a2) { return 1 - 3*a2 + 3*a1; }
  function B(a1, a2) { return 3*a2 - 6*a1; }
  function Cf(a)     { return 3*a; }
  function calc(t, a1, a2) { return ((A(a1,a2)*t + B(a1,a2))*t + Cf(a1))*t; }
  function slp(t, a1, a2)  { return 3*A(a1,a2)*t*t + 2*B(a1,a2)*t + Cf(a1); }
  function getT(x) {
    let t = x;
    for (let i = 0; i < 8; i++) {
      const s = slp(t, x1, x2);
      if (Math.abs(s) < 1e-6) break;
      t -= (calc(t, x1, x2) - x) / s;
    }
    return t;
  }
  return x => (x <= 0) ? 0 : (x >= 1) ? 1 : calc(getT(x), y1, y2);
}
const ease = makeCubicBezier(0.22, 1, 0.36, 1);

const sleep = ms => new Promise(r => setTimeout(r, ms));

function tween(from, to, dur, cb) {
  return new Promise(resolve => {
    const s = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - s) / dur);
      cb(from + (to - from) * ease(p));
      if (p < 1) requestAnimationFrame(step);
      else { cb(to); resolve(); }
    })(performance.now());
  });
}

function dotIn(id, delay) {
  return (async () => {
    await sleep(delay);
    const d = document.getElementById(id);
    return tween(0, 1, 400, v => {
      d.style.opacity = v.toFixed(3);
      d.style.transform = `scale(${(0.6 + 0.4*v).toFixed(3)})`;
    });
  })();
}

/* ── Reset ── */
function resetState() {
  document.getElementById('crValue').textContent = '0.0%';
  document.getElementById('crBadge').textContent = '↓ 0%';
  document.getElementById('doValue').textContent = '0%';
  ['leg1','leg2'].forEach(id =>
    (document.getElementById(id).textContent = '0%'));

  bgRing.style.opacity = '0';
  greenSeg.setAttribute('d', '');
  redSeg.setAttribute('d', '');
  graySeg.setAttribute('d', '');
  centerText.style.opacity = '0';
  centerText.setAttribute('transform', 'translate(0,5)');

  ['dot1','dot2'].forEach(id => {
    const d = document.getElementById(id);
    d.style.opacity = '0';
    d.style.transform = 'scale(0.6)';
  });
}

/* ── One cycle ── */
async function runCycle() {
  resetState();
  await sleep(50);

  /* Metrics */
  const p1 = tween(0, 24.6, 1500, v =>
    (document.getElementById('crValue').textContent = v.toFixed(1) + '%'));
  const p2 = (async () => {
    await sleep(200);
    return tween(0, 13, 1200, v =>
      (document.getElementById('crBadge').textContent = '↓ ' + Math.round(v) + '%'));
  })();
  const p3 = tween(0, 42, 1500, v =>
    (document.getElementById('doValue').textContent = Math.round(v) + '%'));

  /* Base ring fade-in */
  const p4 = tween(0, 1, 400, v => (bgRing.style.opacity = v.toFixed(3)));

  /* Green: -90° → 82.8°  delay 100ms  dur 900ms */
  const p5 = (async () => {
    await sleep(100);
    return tween(G_S, G_E, 900, a =>
      greenSeg.setAttribute('d', describeArc(CX, CY, R, G_S, a)));
  })();

  /* Red: 82.8° → 234°  delay 350ms  dur 900ms */
  const p6 = (async () => {
    await sleep(350);
    return tween(R_S, R_E, 900, a =>
      redSeg.setAttribute('d', describeArc(CX, CY, R, R_S, a)));
  })();

  /* Gray: 234° → 270°  delay 650ms  dur 600ms */
  const p7 = (async () => {
    await sleep(650);
    return tween(S_S, S_E, 600, a =>
      graySeg.setAttribute('d', describeArc(CX, CY, R, S_S, a)));
  })();

  /* Center text fade with subtle rise */
  const p8 = (async () => {
    await sleep(500);
    return tween(0, 1, 600, v => {
      centerText.style.opacity = v.toFixed(3);
      centerText.setAttribute('transform', `translate(0,${(5*(1-v)).toFixed(2)})`);
    });
  })();

  /* Legend items — staggered */
  const p9  = dotIn('dot1', 200);
  const p10 = (async () => {
    await sleep(200);
    return tween(0, 48, 1200, v =>
      (document.getElementById('leg1').textContent = Math.round(v) + '%'));
  })();
  const p11 = dotIn('dot2', 350);
  const p12 = (async () => {
    await sleep(350);
    return tween(0, 42, 1200, v =>
      (document.getElementById('leg2').textContent = Math.round(v) + '%'));
  })();
  await Promise.all([p1,p2,p3,p4,p5,p6,p7,p8,p9,p10,p11,p12]);
}

/* ── Loop ── */
async function loop() {
  await sleep(350);
  while (true) {
    await runCycle();
    await sleep(1400);
  }
}

setTimeout(loop, Math.floor(Math.random() * 4000));
</script>
</body>
</html>
