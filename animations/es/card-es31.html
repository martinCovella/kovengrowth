<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koven Growth — ROAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111111;
  font-family: 'Inter', sans-serif;
}

/* ── Card ── */
.card {
  width: 405px;
  height: 410px;
  background: #181818;
  border-radius: 24px;
  border: none;
  padding: 28px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Title ── */
h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: 32px;
  line-height: 0.95;
  letter-spacing: -0.7px;
  color: #F4F2EA;
  flex-shrink: 0;
}

/* ── ROAS metric ── */
.roas-section {
  margin-top: 18px;
  flex-shrink: 0;
}

.roas-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1px;
  color: rgba(255,255,255,0.48);
  margin-bottom: 5px;
}

.roas-row {
  display: flex;
  align-items: center;
  gap: 9px;
}

.roas-value {
  font-size: 31px;
  font-weight: 400;
  letter-spacing: -1px;
  color: #F4F2EA;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.roas-badge {
  background: rgba(36, 184, 68, 0.16);
  color: #55E85B;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.roas-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.42);
  margin-top: 4px;
}

/* ── Chart ── */
.chart-wrap {
  margin-top: auto;
  flex-shrink: 0;
  width: 100%;
  height: 155px;
}

.chart-svg {
  width: 100%;
  height: 155px;
  display: block;
  overflow: visible;
}

/* Dot scale origin */
#dots circle {
  transform-box: fill-box;
  transform-origin: center;
}
  html,body{background:transparent!important;}
</style>
</head>
<body>
<div class="card">

  <h1>Más Margen.<br>Menos Fricción.</h1>

  <div class="roas-section">
    <div class="roas-label">ROAS</div>
    <div class="roas-row">
      <span class="roas-value" id="roasValue">0.0x</span>
      <span class="roas-badge" id="roasBadge">↑ 0%</span>
    </div>
    <div class="roas-sub">vs últimos 30 días</div>
  </div>

  <div class="chart-wrap">
    <svg class="chart-svg" viewBox="0 0 349 155">
      <defs>
        <!-- Green area gradient -->
        <linearGradient id="greenAreaGrad" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="128">
          <stop offset="0%"   stop-color="#4AD85A" stop-opacity="0.28"/>
          <stop offset="55%"  stop-color="#4AD85A" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#4AD85A" stop-opacity="0.02"/>
        </linearGradient>
        <!-- Red dip area gradient -->
        <linearGradient id="redAreaGrad" gradientUnits="userSpaceOnUse" x1="0" y1="35" x2="0" y2="128">
          <stop offset="0%"   stop-color="#E16A55" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#E16A55" stop-opacity="0.00"/>
        </linearGradient>
        <!-- Clip path for left-to-right reveal -->
        <clipPath id="lineReveal">
          <rect id="revealRect" x="26" y="0" width="0" height="160"/>
        </clipPath>
      </defs>

      <!-- Grid -->
      <g id="grid" opacity="0">
        <line x1="26" y1="8"   x2="345" y2="8"   stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="26" y1="38"  x2="345" y2="38"  stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="26" y1="68"  x2="345" y2="68"  stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="26" y1="98"  x2="345" y2="98"  stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="26" y1="128" x2="345" y2="128" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
      </g>

      <!-- Y labels -->
      <g id="yLabels" opacity="0"
         font-family="Inter,sans-serif" font-size="12" fill="rgba(255,255,255,0.48)"
         text-anchor="end">
        <text x="22" y="8"   dominant-baseline="middle">8x</text>
        <text x="22" y="38"  dominant-baseline="middle">6x</text>
        <text x="22" y="68"  dominant-baseline="middle">4x</text>
        <text x="22" y="98"  dominant-baseline="middle">2x</text>
        <text x="22" y="128" dominant-baseline="middle">0x</text>
      </g>

      <!-- Left-to-right clipped reveal group -->
      <g clip-path="url(#lineReveal)">

        <!-- Green area (full line extent) -->
        <path id="greenArea" fill="url(#greenAreaGrad)" opacity="0"/>

        <!-- Red dip areas -->
        <path id="redArea1" fill="url(#redAreaGrad)" opacity="0"/>
        <path id="redArea2" fill="url(#redAreaGrad)" opacity="0"/>

        <!-- Green line segments -->
        <path id="greenSeg1" fill="none" stroke="#4AD85A" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path id="greenSeg2" fill="none" stroke="#4AD85A" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path id="greenSeg3" fill="none" stroke="#4AD85A" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Red dip segments -->
        <path id="redSeg1" fill="none" stroke="#E16A55" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path id="redSeg2" fill="none" stroke="#E16A55" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Dots -->
        <g id="dots"/>

      </g>

      <!-- X labels (outside clip — always visible) -->
      <g id="xLabels" opacity="0"
         font-family="Inter,sans-serif" font-size="12" fill="rgba(255,255,255,0.48)"
         text-anchor="middle"/>
    </svg>
  </div>

</div>
<script>
/* ── Data ── */
//        Ene          Feb          Mar (dip)             Abr          May (dip)     Jun
const DATA = [6.7, 6.8, 6.8, 6.7, 6.9, 5.4, 6.9, 6.9, 6.9, 5.3, 6.7, 6.9, 6.9];
const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun'];
const N = DATA.length; /* 13 */

/* ── Geometry ── */
const PL   = 26;   /* plot left  */
const PR   = 345;  /* plot right */
const PT   = 8;    /* top y  (8x) */
const PB   = 128;  /* base y (0x) */
const PH   = PB - PT;   /* 120 */
const Y_MAX = 8;
const PW   = PR - PL;   /* 319 — reveal width */

function toX(i) { return PL + (i / (N - 1)) * PW; }
function toY(v) { return PB - (v / Y_MAX) * PH; }

const pts = DATA.map((v, i) => ({ x: toX(i), y: toY(v) }));

/* ── Smooth path builder (Catmull-Rom → Cubic Bezier) ── */
function buildPath(from, to) {
  let d = `M ${pts[from].x.toFixed(2)},${pts[from].y.toFixed(2)}`;
  for (let i = from + 1; i <= to; i++) {
    const p0 = pts[Math.max(0, i - 2)];
    const p1 = pts[i - 1];
    const p2 = pts[i];
    const p3 = pts[Math.min(N - 1, i + 1)];
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p2.x.toFixed(2)},${p2.y.toFixed(2)}`;
  }
  return d;
}

function buildAreaPath(from, to) {
  return `${buildPath(from, to)} L ${pts[to].x.toFixed(2)},${PB} L ${pts[from].x.toFixed(2)},${PB} Z`;
}

/* ── Inject paths ── */
// Segment boundaries: dip 1 = indices 4-6, dip 2 = indices 8-10
document.getElementById('greenArea').setAttribute('d', buildAreaPath(0, 12));
document.getElementById('redArea1').setAttribute('d', buildAreaPath(4, 6));
document.getElementById('redArea2').setAttribute('d', buildAreaPath(8, 10));

document.getElementById('greenSeg1').setAttribute('d', buildPath(0, 4));
document.getElementById('redSeg1').setAttribute('d', buildPath(4, 6));
document.getElementById('greenSeg2').setAttribute('d', buildPath(6, 8));
document.getElementById('redSeg2').setAttribute('d', buildPath(8, 10));
document.getElementById('greenSeg3').setAttribute('d', buildPath(10, 12));

/* ── Inject dots ── */
const dotsG  = document.getElementById('dots');
const dotEls = pts.map((p, i) => {
  const isRed = (i >= 4 && i <= 6) || (i >= 8 && i <= 10);
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', p.x.toFixed(2));
  c.setAttribute('cy', p.y.toFixed(2));
  c.setAttribute('r',  '3.5');
  c.setAttribute('fill', isRed ? '#E16A55' : '#4AD85A');
  c.style.opacity   = '0';
  c.style.transform = 'scale(0.5)';
  c.style.filter    = isRed
    ? 'drop-shadow(0 0 4px rgba(225,106,85,0.45))'
    : 'drop-shadow(0 0 4px rgba(74,216,90,0.45))';
  dotsG.appendChild(c);
  return { el: c, relX: p.x - PL };
});

/* ── Inject X labels ── */
const xLabels = document.getElementById('xLabels');
MONTHS.forEach((m, mi) => {
  const cx = PL + (mi + 0.5) * (PW / 6);
  const t  = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', cx.toFixed(1));
  t.setAttribute('y', '147');
  t.textContent = m;
  xLabels.appendChild(t);
});

const revealRect = document.getElementById('revealRect');

/* ── Animation utilities ── */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function cubicOut(t) { return 1 - Math.pow(1 - t, 3); }

function tween(from, to, dur, onUpdate) {
  return new Promise(resolve => {
    const s = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - s) / dur);
      const e = cubicOut(p);
      onUpdate(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
      else { onUpdate(to); resolve(); }
    })(performance.now());
  });
}

/* ── Reset ── */
function resetState() {
  document.getElementById('roasValue').textContent = '0.0x';
  document.getElementById('roasBadge').textContent = '↑ 0%';
  document.getElementById('grid').style.opacity    = '0';
  document.getElementById('yLabels').style.opacity = '0';
  document.getElementById('xLabels').style.opacity = '0';
  document.getElementById('greenArea').style.opacity = '0';
  document.getElementById('redArea1').style.opacity  = '0';
  document.getElementById('redArea2').style.opacity  = '0';
  revealRect.setAttribute('width', '0');
  dotEls.forEach(d => {
    d.el.style.opacity   = '0';
    d.el.style.transform = 'scale(0.5)';
  });
}

/* ── One cycle ── */
async function runCycle() {
  resetState();
  await sleep(50);

  /* Grid + labels fade in */
  tween(0, 1, 500, v => {
    document.getElementById('grid').style.opacity    = v;
    document.getElementById('yLabels').style.opacity = v;
    document.getElementById('xLabels').style.opacity = v;
  });

  /* ROAS count-up */
  const p1 = tween(0, 5.2, 1500, v =>
    (document.getElementById('roasValue').textContent = v.toFixed(1) + 'x'));

  /* Badge count-up (200ms delay) */
  const p2 = (async () => {
    await sleep(200);
    return tween(0, 28, 1200, v =>
      (document.getElementById('roasBadge').textContent = '↑ ' + Math.round(v) + '%'));
  })();

  /* Line reveal — drives clip rect, areas, and dots */
  const dip1RelX = pts[5].x - PL; /* Mar dip center */
  const dip2RelX = pts[9].x - PL; /* May dip center */

  const p3 = tween(0, PW, 1800, v => {
    /* Advance clip rect */
    revealRect.setAttribute('width', v.toFixed(2));

    /* Green area — fades in shortly after line starts */
    const areaP = Math.max(0, (v - PW * 0.06) / (PW * 0.42));
    document.getElementById('greenArea').style.opacity =
      (cubicOut(Math.min(1, areaP)) * 0.92).toFixed(3);

    /* Red area 1 — appears as line enters the Mar dip */
    const r1P = Math.max(0, (v - (dip1RelX - 18)) / 55);
    document.getElementById('redArea1').style.opacity =
      (cubicOut(Math.min(1, r1P)) * 0.78).toFixed(3);

    /* Red area 2 — appears as line enters the May dip */
    const r2P = Math.max(0, (v - (dip2RelX - 18)) / 55);
    document.getElementById('redArea2').style.opacity =
      (cubicOut(Math.min(1, r2P)) * 0.78).toFixed(3);

    /* Dots — pop in as clip sweeps past their x */
    dotEls.forEach(d => {
      if (v >= d.relX) {
        const lp = Math.min(1, (v - d.relX) / 28);
        const e  = cubicOut(lp);
        d.el.style.opacity   = e.toFixed(3);
        d.el.style.transform = `scale(${(0.5 + 0.5 * e).toFixed(3)})`;
      }
    });
  });

  await Promise.all([p1, p2, p3]);
}

/* ── Loop ── */
async function loop() {
  await sleep(350);
  while (true) {
    await runCycle();
    await sleep(1400);
  }
}

setTimeout(loop, Math.floor(Math.random() * 4000));
</script>
</body>
</html>
