<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card ES12 — Crecimiento de Suscripciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111109;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ── Outer card ──────────────────────────────────────────────
       860px, deep warm black, 32px radius
    ─────────────────────────────────────────────────────────── */
    .card {
      width: 860px;
      max-width: 100%;
      background: #030303;
      border-radius: 32px;
      padding: 38px 38px 28px;
      box-shadow: 0 22px 60px rgba(0,0,0,0.35);
    }

    /* ── Title ──────────────────────────────────────────────────
       Playfair Display 500, 70px, lh 0.92, ls -2px, cream
    ─────────────────────────────────────────────────────────── */
    .card-title {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-size: 70px;
      font-weight: 500;
      line-height: 0.92;
      letter-spacing: -2px;
      color: #F6F0E3;
      margin-bottom: 28px;
    }

    /* ── Main panel ─────────────────────────────────────────────
       Radial orange glow, warm border, dark bg
    ─────────────────────────────────────────────────────────── */
    .panel-main {
      background: radial-gradient(circle at 38% 28%, rgba(255,128,0,0.14) 0%, rgba(0,0,0,0.92) 62%);
      border: 1px solid rgba(255,126,0,0.28);
      border-radius: 22px;
      padding: 30px 32px 28px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
    }

    .new-sub-label {
      font-size: 34px;
      font-weight: 400;
      color: #E8B87E;
      letter-spacing: -0.3px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .main-number {
      font-size: 90px;
      font-weight: 700;
      letter-spacing: -4px;
      color: #F7F0E4;
      line-height: 1;
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
    }

    /* Trend badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: rgba(255,128,0,0.10);
      border: 1px solid rgba(255,128,0,0.22);
      border-radius: 12px;
      padding: 8px 18px;
      color: #E8B87E;
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 30px;
      width: fit-content;
      line-height: 1.2;
    }

    .badge svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    /* ── Chart row: bars (left) + legend (right) ─────────────── */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 18px;
    }

    /* Chart area: bars + baseline */
    .chart-area {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Bars container — fixed height, bars align to bottom */
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 42px;
      height: 200px;
    }

    .bar-wrap {
      width: 86px;
      height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Individual bar — grows from 0 via JS */
    .bar {
      width: 86px;
      height: 0;
      border-radius: 4px 4px 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top segment: new subscribers (orange) */
    .seg-new      { background: #FF820F; flex: 30; }
    /* Bottom segment: existing subscribers (cream) */
    .seg-existing { background: #FFC58F; flex: 70; }

    /* Baseline under bars */
    .baseline {
      width: 342px; /* 86×3 + 42×2 */
      height: 1px;
      background: rgba(255,128,0,0.20);
      flex-shrink: 0;
    }

    /* ── Legend ─────────────────────────────────────────────── */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 30px;
      padding-bottom: 2px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .legend-sq {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .legend-text {
      font-size: 20px;
      font-weight: 400;
      color: #F7F0E4;
      line-height: 1.2;
    }

    /* ── KPI bottom panel ───────────────────────────────────────
       3-column grid with orange separators
    ─────────────────────────────────────────────────────────── */
    .panel-kpi {
      background: rgba(255,128,0,0.05);
      border: 1px solid rgba(255,126,0,0.28);
      border-radius: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      overflow: hidden;
    }

    .kpi-col {
      padding: 22px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-col + .kpi-col {
      border-left: 1px solid rgba(255,128,0,0.25);
    }

    .kpi-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .kpi-header svg {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    .kpi-label {
      font-size: 24px;
      font-weight: 400;
      color: #E8B87E;
      line-height: 1.2;
    }

    .kpi-number {
      font-size: 52px;
      font-weight: 700;
      color: #FF820F;
      letter-spacing: -2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .kpi-sub {
      font-size: 22px;
      font-weight: 400;
      color: #E8B87E;
      opacity: 0.72;
      margin-top: 2px;
    }
    html,body{background:transparent!important;}
</style>
</head>
<body>

<div class="card">

  <!-- Title -->
  <div class="card-title">
    Crecimiento de<br>Suscripciones
  </div>

  <!-- ── Main panel ─────────────────────────────────────────── -->
  <div class="panel-main">

    <div class="new-sub-label">Nuevos Suscriptores</div>
    <div class="main-number">+<span id="main-val">0</span></div>

    <!-- Trend badge -->
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FF850F"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17 9 11l4 4 9-9"/>
        <path d="M17 7h4v4"/>
      </svg>
      +18% vs. mes anterior
    </div>

    <!-- Chart row -->
    <div class="chart-row">

      <!-- Stacked bar chart -->
      <div class="chart-area">
        <div class="bars">

          <!-- Bar 1 — target 140px -->
          <div class="bar-wrap">
            <div class="bar" id="b1">
              <div class="seg seg-new"></div>
              <div class="seg seg-existing"></div>
            </div>
          </div>

          <!-- Bar 2 — target 165px -->
          <div class="bar-wrap">
            <div class="bar" id="b2">
              <div class="seg seg-new"></div>
              <div class="seg seg-existing"></div>
            </div>
          </div>

          <!-- Bar 3 — target 190px -->
          <div class="bar-wrap">
            <div class="bar" id="b3">
              <div class="seg seg-new"></div>
              <div class="seg seg-existing"></div>
            </div>
          </div>

        </div>
        <div class="baseline"></div>
      </div>

      <!-- Legend -->
      <div class="legend">
        <div class="legend-item">
          <div class="legend-sq" style="background:#FF820F"></div>
          <span class="legend-text">Nuevos Suscriptores</span>
        </div>
        <div class="legend-item">
          <div class="legend-sq" style="background:#FFC58F"></div>
          <span class="legend-text">Suscriptores Activos</span>
        </div>
      </div>

    </div>

  </div><!-- /panel-main -->

  <!-- ── KPI panel ─────────────────────────────────────────── -->
  <div class="panel-kpi">

    <!-- Churn -->
    <div class="kpi-col">
      <div class="kpi-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FF820F"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
        <span class="kpi-label">Abandono</span>
      </div>
      <div class="kpi-number">-<span id="churn-val">0</span>%</div>
      <div class="kpi-sub">vs. mes anterior</div>
    </div>

    <!-- LTV -->
    <div class="kpi-col">
      <div class="kpi-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FF820F"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M6 20v-2a6 6 0 0 1 12 0v2"/>
        </svg>
        <span class="kpi-label">Valor de Vida</span>
      </div>
      <div class="kpi-number">+<span id="ltv-val">0</span>%</div>
      <div class="kpi-sub">vs. mes anterior</div>
    </div>

    <!-- Retention -->
    <div class="kpi-col">
      <div class="kpi-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FF820F"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21 6l-2 14H5L3 6l4.094 3.164a1 1 0 0 0 1.516-.294z"/>
          <path d="M5 21h14"/>
        </svg>
        <span class="kpi-label">Retención</span>
      </div>
      <div class="kpi-number"><span id="ret-val">0</span>%</div>
      <div class="kpi-sub">clientes activos</div>
    </div>

  </div><!-- /panel-kpi -->

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════════════════════ */
const MAIN_TARGET  = 312;
const BAR_TARGETS  = [140, 165, 190];   // px
const BAR_DELAYS   = [150, 300, 450];   // ms
const BAR_DUR      = 1200;

const CHURN_TARGET = 12;
const LTV_TARGET   = 28;
const RET_TARGET   = 88;
const KPI_DUR      = 1200;
const CHURN_DELAY  = 350;
const LTV_DELAY    = 450;
const RET_DELAY    = 550;

const T_ANIM = Math.max(BAR_DELAYS[2] + BAR_DUR, RET_DELAY + KPI_DUR, 1500); // 1750ms
const T_HOLD = 1800;
const T_LOOP = T_ANIM + T_HOLD;   // 3550ms

const easeOut3 = p => 1 - Math.pow(1 - p, 3);

/* ── DOM refs ── */
const mainEl  = document.getElementById('main-val');
const churnEl = document.getElementById('churn-val');
const ltvEl   = document.getElementById('ltv-val');
const retEl   = document.getElementById('ret-val');
const barEls  = ['b1','b2','b3'].map(id => document.getElementById(id));

/* ═══════════════════════════════════════════════════════════════
   ANIMATION LOOP
════════════════════════════════════════════════════════════════ */
let t0 = null;

function tick(ts) {
  if (!t0) t0 = ts - Math.floor(Math.random() * T_LOOP);
  const t = (ts - t0) % T_LOOP;

  if (t <= T_ANIM) {

    /* Main counter */
    const pm = easeOut3(Math.min(t / 1500, 1));
    mainEl.textContent = Math.round(MAIN_TARGET * pm);

    /* Stacked bars */
    barEls.forEach((el, i) => {
      const e = Math.max(0, t - BAR_DELAYS[i]);
      const p = easeOut3(Math.min(e / BAR_DUR, 1));
      el.style.height = (BAR_TARGETS[i] * p).toFixed(1) + 'px';
    });

    /* KPI counters */
    const ec = Math.max(0, t - CHURN_DELAY);
    churnEl.textContent = Math.round(CHURN_TARGET * easeOut3(Math.min(ec / KPI_DUR, 1)));

    const el2 = Math.max(0, t - LTV_DELAY);
    ltvEl.textContent = Math.round(LTV_TARGET * easeOut3(Math.min(el2 / KPI_DUR, 1)));

    const er = Math.max(0, t - RET_DELAY);
    retEl.textContent = Math.round(RET_TARGET * easeOut3(Math.min(er / KPI_DUR, 1)));

  } else {

    /* Hold at final values */
    mainEl.textContent  = MAIN_TARGET;
    barEls.forEach((el, i) => el.style.height = BAR_TARGETS[i] + 'px');
    churnEl.textContent = CHURN_TARGET;
    ltvEl.textContent   = LTV_TARGET;
    retEl.textContent   = RET_TARGET;
  }

  requestAnimationFrame(tick);
}

document.fonts.ready.then(() => requestAnimationFrame(tick));
</script>

</body>
</html>
