<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koven Growth — Meta Ads ROAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  margin: 0; padding: 0; height: auto; min-height: 0;
}
body {
  display: block;
  background: #050607;
  font-family: 'Inter', sans-serif;
  width: 455px;
  height: 455px;
}

/* ── Card ── */
.card {
  width: 455px;
  height: 455px;
  background: #111416;
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.06);
  padding: 28px 26px;
  box-shadow:
    0 20px 45px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.04);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: 30px;
  line-height: 1.02;
  letter-spacing: -0.8px;
  color: #F4F2EA;
  max-width: 390px;
  flex-shrink: 0;
}

.subtitle {
  font-size: 15.5px;
  line-height: 1.45;
  font-weight: 400;
  color: rgba(255,255,255,0.58);
  margin-top: 14px;
  flex-shrink: 0;
}

/* ── ROAS section ── */
.roas-section {
  margin-top: 22px;
  flex-shrink: 0;
}

.roas-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: rgba(255,255,255,0.50);
  margin-bottom: 6px;
}

.roas-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.roas-value {
  font-size: 40px;
  font-weight: 400;
  letter-spacing: -1.5px;
  color: #F5F5F2;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.roas-badge {
  background: rgba(36, 184, 68, 0.12);
  border-radius: 6px;
  padding: 5px 9px;
  color: #3BE047;
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.roas-subtext {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-top: 4px;
}

/* ── Chart ── */
.chart-wrap {
  margin-top: auto;
  width: 100%;
  flex-shrink: 0;
  height: 145px;
}

.chart-svg {
  width: 100%;
  height: 145px;
  display: block;
  overflow: visible;
}

/* Line glow */
#chartLine {
  filter: drop-shadow(0 0 5px rgba(49,216,67,0.22));
}

/* Dot scale origin fix */
#chartDots circle {
  transform-box: fill-box;
  transform-origin: center;
}
</style>
</head>
<body>
<div class="card">

  <h1>Ads that scale<br>without burning your ROAS.</h1>
  <p class="subtitle">Meta Ads strategies focused on profitability<br>and sustainable growth.</p>

  <div class="roas-section">
    <div class="roas-label">ROAS</div>
    <div class="roas-row">
      <span class="roas-value" id="roasValue">0.0x</span>
      <span class="roas-badge" id="roasBadge">↑ 0%</span>
    </div>
    <div class="roas-subtext">vs last 30 days</div>
  </div>

  <div class="chart-wrap">
    <svg class="chart-svg" id="chartSvg" viewBox="0 0 403 145" preserveAspectRatio="none">
      <defs>
        <!-- Area gradient: top of plot (6x) → transparent at bottom (0x) -->
        <linearGradient id="areaGrad" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="125">
          <stop offset="0%"   stop-color="#31D843" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#31D843" stop-opacity="0.00"/>
        </linearGradient>
      </defs>

      <!-- Grid lines (faded in by JS) -->
      <g id="grid" opacity="0">
        <line x1="26" y1="8"   x2="399" y2="8"   stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="26" y1="47"  x2="399" y2="47"  stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="26" y1="86"  x2="399" y2="86"  stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="26" y1="125" x2="399" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
      </g>

      <!-- Y labels (static) -->
      <text x="0" y="8"   font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.48)" dominant-baseline="middle">6x</text>
      <text x="0" y="47"  font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.48)" dominant-baseline="middle">4x</text>
      <text x="0" y="86"  font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.48)" dominant-baseline="middle">2x</text>
      <text x="0" y="125" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.48)" dominant-baseline="middle">0x</text>

      <!-- Area (opacity driven by JS) -->
      <path id="chartArea" fill="url(#areaGrad)" opacity="0"/>

      <!-- Line (stroke-dashoffset driven by JS) -->
      <path id="chartLine" fill="none" stroke="#31D843" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Dots (opacity + transform driven by JS) -->
      <g id="chartDots"/>

      <!-- X labels -->
      <g id="xLabels" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.48)" text-anchor="middle"/>
    </svg>
  </div>

</div>
<script>
/* ── Chart config ── */
const DATA = [
  1.2, 1.7, 2.4,   /* Jan */
  1.9, 2.3, 3.1,   /* Feb */
  3.5, 3.6, 3.2,   /* Mar */
  3.1, 3.4, 3.6,   /* Apr */
  3.1, 3.8, 4.8,   /* May */
  4.2, 4.0, 3.7,   /* Jun */
  4.8, 5.1, 5.2    /* Final */
];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];

/* Plot geometry (SVG user units) */
const PL = 26;   /* plot left  (after Y labels) */
const PR = 399;  /* plot right (403 - 4px margin) */
const PT = 8;    /* plot top   → 6x */
const PB = 125;  /* plot bottom → 0x */
const PH = PB - PT;  /* 117 */
const Y_MAX = 6;

function toX(i) {
  return PL + (i / (DATA.length - 1)) * (PR - PL);
}
function toY(v) {
  return PB - (v / Y_MAX) * PH;
}

/* Compute pixel points */
const pts = DATA.map((v, i) => ({ x: toX(i), y: toY(v) }));

/* Catmull-Rom → Cubic Bezier smooth path */
function buildLinePath(points) {
  let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
  for (let i = 1; i < points.length; i++) {
    const p0 = points[Math.max(0, i - 2)];
    const p1 = points[i - 1];
    const p2 = points[i];
    const p3 = points[Math.min(points.length - 1, i + 1)];
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  return d;
}

const linePath   = buildLinePath(pts);
const lastPt     = pts[pts.length - 1];
const firstPt    = pts[0];
const areaPath   = linePath
  + ` L ${lastPt.x.toFixed(2)} ${PB} L ${firstPt.x.toFixed(2)} ${PB} Z`;

/* Inject paths */
const chartLine = document.getElementById('chartLine');
const chartArea = document.getElementById('chartArea');
chartLine.setAttribute('d', linePath);
chartArea.setAttribute('d', areaPath);

/* Inject dots */
const dotsG = document.getElementById('chartDots');
const dots = pts.map((p, i) => {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', p.x.toFixed(2));
  c.setAttribute('cy', p.y.toFixed(2));
  c.setAttribute('r', '3');
  c.setAttribute('fill', '#31D843');
  c.style.opacity = '0';
  c.style.transform = 'scale(0.4)';
  dotsG.appendChild(c);
  return c;
});

/* Inject X labels */
const xLabels = document.getElementById('xLabels');
MONTHS.forEach((m, mi) => {
  const midIdx = mi * 3 + 1; /* center point of each 3-point group */
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', toX(midIdx).toFixed(2));
  t.setAttribute('y', '141');
  t.textContent = m;
  xLabels.appendChild(t);
});

/* Line total length (after DOM is ready) */
const totalLen = chartLine.getTotalLength();
chartLine.style.strokeDasharray = totalLen;
chartLine.style.strokeDashoffset = totalLen;

/* ── Animation utilities ── */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function cubicOut(t) {
  return 1 - Math.pow(1 - t, 3);
}

function tween(from, to, dur, onUpdate) {
  return new Promise(resolve => {
    const s = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - s) / dur);
      const e = cubicOut(p);
      onUpdate(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
      else { onUpdate(to); resolve(); }
    })(performance.now());
  });
}

/* ── Reset to initial state ── */
function resetState() {
  document.getElementById('roasValue').textContent = '0.0x';
  document.getElementById('roasBadge').textContent = '↑ 0%';
  chartLine.style.strokeDashoffset = totalLen;
  chartArea.style.opacity = '0';
  document.getElementById('grid').style.opacity = '0';
  dots.forEach(d => {
    d.style.opacity = '0';
    d.style.transform = 'scale(0.4)';
  });
}

/* ── One animation cycle ── */
async function runCycle() {
  resetState();
  await sleep(50); /* let browser paint the reset */

  /* Grid fade in */
  tween(0, 1, 500, v => {
    document.getElementById('grid').style.opacity = v;
  });

  /* ROAS count-up */
  const roasAnim = tween(0, 4.8, 1500, v => {
    document.getElementById('roasValue').textContent = v.toFixed(1) + 'x';
  });

  /* Badge count-up (200ms delay) */
  await sleep(200);
  const badgeAnim = tween(0, 33, 1200, v => {
    document.getElementById('roasBadge').textContent = '↑ ' + Math.round(v) + '%';
  });

  /* Line draw + dot stagger (100ms more) */
  await sleep(100);
  await new Promise(lineResolve => {
    const lineStart = performance.now();
    const LINE_DUR  = 1800;
    function drawLine(now) {
      const p  = Math.min(1, (now - lineStart) / LINE_DUR);
      const e  = cubicOut(p);
      chartLine.style.strokeDashoffset = totalLen * (1 - e);

      /* Reveal each dot as the line sweeps through its X position */
      dots.forEach((dot, i) => {
        const dotT = i / (dots.length - 1);
        if (e >= dotT) {
          const lp = Math.min(1, (e - dotT) / 0.055);
          const ep = cubicOut(lp);
          dot.style.opacity = ep;
          dot.style.transform = `scale(${0.4 + 0.6 * ep})`;
        }
      });

      if (p < 1) requestAnimationFrame(drawLine);
      else {
        dots.forEach(d => {
          d.style.opacity = '1';
          d.style.transform = 'scale(1)';
        });
        lineResolve();
      }
    }
    requestAnimationFrame(drawLine);
  });

  /* Area reveal after line completes */
  tween(0, 1, 700, v => { chartArea.style.opacity = v; });

  /* Wait for ROAS + badge (usually already done) */
  await Promise.all([roasAnim, badgeAnim]);
}

/* ── Loop ── */
async function loop() {
  await sleep(350); /* initial pause before first cycle */
  while (true) {
    await runCycle();
    await sleep(1200); /* display final state */
  }
}

const __animDelay = parseInt(new URLSearchParams(location.search).get('delay')||'0',10);
setTimeout(loop, __animDelay);
</script>
</body>
</html>
