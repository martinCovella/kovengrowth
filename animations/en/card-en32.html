<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koven Growth — AOV Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111111;
  font-family: 'Inter', sans-serif;
}

/* ── Card ── */
.card {
  width: 405px;
  height: 410px;
  background: #181818;
  border-radius: 0;
  border: none;
  padding: 28px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Title ── */
h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: 29px;
  line-height: 0.98;
  letter-spacing: -0.7px;
  color: #F4F2EA;
  flex-shrink: 0;
}

/* ── AOV metric ── */
.aov-section {
  margin-top: 18px;
  flex-shrink: 0;
}

.aov-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1px;
  color: rgba(255,255,255,0.48);
  margin-bottom: 5px;
}

.aov-row {
  display: flex;
  align-items: center;
  gap: 9px;
}

.aov-value {
  font-size: 31px;
  font-weight: 400;
  letter-spacing: -1px;
  color: #F4F2EA;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.aov-badge {
  background: rgba(36, 184, 68, 0.16);
  color: #55E85B;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.aov-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.42);
  margin-top: 4px;
}

/* ── Chart ── */
.chart-wrap {
  margin-top: auto;
  flex-shrink: 0;
  width: 100%;
  height: 145px;
  filter: drop-shadow(0 0 14px rgba(93,219,97,0.10));
}

.chart-svg {
  width: 100%;
  height: 145px;
  display: block;
}

/* Rounded-top bar transform origin */
#bars path {
  transform-box: fill-box;
  transform-origin: bottom center;
}
html, body { background: transparent !important; }
</style>
</head>
<body>
<div class="card">

  <h1>Your checkout is losing<br>money. Fix it.</h1>

  <div class="aov-section">
    <div class="aov-label">AOV</div>
    <div class="aov-row">
      <span class="aov-value" id="aovValue">€0.00</span>
      <span class="aov-badge" id="aovBadge">↑ 0%</span>
    </div>
    <div class="aov-sub">vs last 30 days</div>
  </div>

  <div class="chart-wrap">
    <svg class="chart-svg" viewBox="0 0 349 145">
      <defs>
        <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#5DDB61" stop-opacity="1"/>
          <stop offset="55%"  stop-color="#2EA943" stop-opacity="1"/>
          <stop offset="100%" stop-color="#2EA943" stop-opacity="0.12"/>
        </linearGradient>
      </defs>

      <!-- Grid -->
      <g id="grid" opacity="0">
        <line x1="38" y1="8"   x2="345" y2="8"   stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="38" y1="45"  x2="345" y2="45"  stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="38" y1="81"  x2="345" y2="81"  stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="38" y1="118" x2="345" y2="118" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
      </g>

      <!-- Y labels -->
      <g id="yLabels" opacity="0"
         font-family="Inter,sans-serif" font-size="12" fill="rgba(255,255,255,0.48)"
         text-anchor="end">
        <text x="33" y="8"   dominant-baseline="middle">€90</text>
        <text x="33" y="45"  dominant-baseline="middle">€60</text>
        <text x="33" y="81"  dominant-baseline="middle">€30</text>
        <text x="33" y="118" dominant-baseline="middle">€0</text>
      </g>

      <!-- Bars (injected by JS) -->
      <g id="bars"/>

      <!-- X labels (injected by JS) -->
      <g id="xLabels" opacity="0"
         font-family="Inter,sans-serif" font-size="12" fill="rgba(255,255,255,0.48)"
         text-anchor="middle"/>
    </svg>
  </div>

</div>
<script>
/* ── Bar config ── */
const BAR_DATA = [
  { label: 'Ene', value: 64, delay: 100  },
  { label: 'Feb', value: 69, delay: 180  },
  { label: 'Mar', value: 74, delay: 260  },
  { label: 'Abr', value: 78, delay: 340  },
  { label: 'May', value: 81, delay: 420  },
  { label: 'Jun', value: 84, delay: 500  },
];

/* ── Chart geometry ── */
const PL    = 38;   /* plot left (after Y labels) */
const PR    = 345;  /* plot right */
const PB    = 118;  /* baseline y (€0) */
const PT    = 8;    /* top y (€90) */
const PH    = PB - PT;  /* 110 */
const Y_MAX = 90;

const SLOTS = BAR_DATA.length;              /* 6 */
const SLOT_W = (PR - PL) / SLOTS;          /* 51.2px */
const BAR_W  = 22;

function barCX(i) { return PL + SLOT_W * (i + 0.5); }
function barLX(i) { return barCX(i) - BAR_W / 2; }
function toY(v)   { return PB - (v / Y_MAX) * PH; }
function fullH(v) { return PB - toY(v); }

/* ── Rounded top rect path ── */
function roundedTopRect(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M ${x},${y+h} L ${x},${y+r} Q ${x},${y} ${x+r},${y} `
       + `L ${x+w-r},${y} Q ${x+w},${y} ${x+w},${y+r} L ${x+w},${y+h} Z`;
}

/* ── Inject bars ── */
const barsG  = document.getElementById('bars');
const barEls = BAR_DATA.map((d, i) => {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  el.setAttribute('fill', 'url(#barGrad)');
  el.setAttribute('d', '');
  el.style.opacity = '0';
  barsG.appendChild(el);
  return { el, bx: barLX(i), fh: fullH(d.value), ty: toY(d.value) };
});

/* ── Inject X labels ── */
const xLabels = document.getElementById('xLabels');
BAR_DATA.forEach((d, i) => {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', barCX(i).toFixed(1));
  t.setAttribute('y', '136');
  t.textContent = d.label;
  xLabels.appendChild(t);
});

/* ── Animation utilities ── */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function cubicOut(t) { return 1 - Math.pow(1 - t, 3); }

function tween(from, to, dur, onUpdate) {
  return new Promise(resolve => {
    const s = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - s) / dur);
      const e = cubicOut(p);
      onUpdate(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
      else { onUpdate(to); resolve(); }
    })(performance.now());
  });
}

/* ── Animate one bar ── */
function animateBar(b, delay) {
  return (async () => {
    await sleep(delay);
    return tween(0, b.fh, 1150, h => {
      b.el.style.opacity = Math.min(1, h / (b.fh * 0.15)).toFixed(3);
      b.el.setAttribute('d', h > 0
        ? roundedTopRect(b.bx, PB - h, BAR_W, h, 2)
        : '');
    });
  })();
}

/* ── Reset ── */
function resetState() {
  document.getElementById('aovValue').textContent  = '€0.00';
  document.getElementById('aovBadge').textContent  = '↑ 0%';
  document.getElementById('grid').style.opacity    = '0';
  document.getElementById('yLabels').style.opacity = '0';
  document.getElementById('xLabels').style.opacity = '0';
  barEls.forEach(b => {
    b.el.setAttribute('d', '');
    b.el.style.opacity = '0';
  });
}

/* ── One cycle ── */
async function runCycle() {
  resetState();
  await sleep(50);

  /* Grid + labels fade */
  tween(0, 1, 500, v => {
    document.getElementById('grid').style.opacity    = v;
    document.getElementById('yLabels').style.opacity = v;
    document.getElementById('xLabels').style.opacity = v;
  });

  /* AOV count-up */
  const p1 = tween(0, 82.45, 1500, v =>
    (document.getElementById('aovValue').textContent = '€' + v.toFixed(2)));

  /* Badge count-up */
  const p2 = (async () => {
    await sleep(200);
    return tween(0, 18, 1200, v =>
      (document.getElementById('aovBadge').textContent = '↑ ' + Math.round(v) + '%'));
  })();

  /* Bars */
  const barPs = barEls.map((b, i) => animateBar(b, BAR_DATA[i].delay));

  await Promise.all([p1, p2, ...barPs]);
}

/* ── Loop ── */
async function loop() {
  await sleep(350);
  while (true) {
    await runCycle();
    await sleep(1400);
  }
}

const __animDelay = parseInt(new URLSearchParams(location.search).get('delay')||'0',10);
setTimeout(loop, __animDelay);
</script>
</body>
</html>
