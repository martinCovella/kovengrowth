<html lang="en">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #e5e3df;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── Card wrapper ─────────────────────── */
    .card-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      display: block;
      container-type: inline-size;
    }

    .card-wrap > img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
    }

    /* ── Animated €7.1K counter (also acts as cover) ──
       Covers from x=420 to x=660, y=244-320 in original.
       padding-left aligns animated € with original text.
       Font-size 7.2cqw matches original character height.
    ──────────────────────────────────────────────── */
    .anim-rev {
      position: absolute;
      left:   38.5%;      /* x=420 — generous left margin    */
      top:    24.9%;      /* y=244 — well above text top     */
      width:  23%;        /* to x=671 — generous right margin */
      height:  8.2%;      /* y=244-324 — tall enough         */
      padding-left: 2.7%; /* aligns animated € with original */
      display: flex;
      align-items: center;
      background: rgb(253, 253, 253);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700;
      color: #008601;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-size: 7.2cqw;   /* matches original cap height */
      line-height: 1;
    }

    /* ── Dot mask ─────────────────────────────────────
       Covers the original endpoint dot in the PNG.
       Dot center=(913,405), spans y=381-429 in orig.
       The top portion (y=381-399) peeks above the
       chart-overlay's top edge and must be masked.
       Pixel bounds (with 5px margin): x=875-952, y=376-434
    ─────────────────────────────────────────────── */
    .dot-mask {
      position: absolute;
      left:   80.13%;
      top:    38.45%;
      width:   7.05%;
      height:  5.93%;
      background: rgb(253, 253, 253);
      pointer-events: none;
    }

    /* ── Chart overlay ────────────────────────────────
       White mask over original chart area +
       strictly clipped container for SVG.
       Pixel bounds in 1092×978 image:
         x=128-936 (73.99% wide, left 11.72%)
         y=400-715 (32.21% tall, top 40.90%)
    ─────────────────────────────────────────────── */
    .chart-overlay {
      position: absolute;
      left:   11.72%;
      top:    40.90%;
      width:  73.99%;
      height: 32.21%;
      overflow: hidden;
      background: rgb(253, 253, 253);
    }

    .chart-overlay > svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* ── Right-side mask ──────────────────────────────
       Covers the dashed-line column and original badge
       that sit just outside the chart-overlay's right
       edge (x=937-1005, y=390-730 in original image).
    ─────────────────────────────────────────────── */
    .chart-mask-right {
      position: absolute;
      left:   85.71%;  /* x=936 */
      top:    39.88%;  /* y=390 — above chart top  */
      width:   6.32%;  /* to x=1005                */
      height: 34.56%;  /* y=390-728                */
      background: rgb(253, 253, 253);
      pointer-events: none;
    }

    /* ── Dashed cursor line ───────────────────────────
       Drops from dot endpoint to top of badge.
       Hidden at start — fades in when dot lands.
    ─────────────────────────────────────────────── */
    .cursor-line {
      position: absolute;
      left:    calc(85.71% - 1px);  /* align with dot x */
      top:     43.1%;               /* just below dot   */
      width:   2px;
      height:  21.0%;               /* to badge top     */
      border-left: 2px dashed #008601;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    /* ── Tooltip badge ────────────────────────────────
       White rounded badge "€7.1K" at bottom of line.
       Hidden at start — fades in when dot lands.
    ─────────────────────────────────────────────── */
    .cursor-badge {
      position: absolute;
      left:   80.9%;
      top:    64.0%;
      width:  10.2%;
      padding: 0.8% 0;
      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 6px;
      box-shadow: 0 1px 8px rgba(0,0,0,.12);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700;
      font-size: 2.8cqw;
      color: #1a1a1a;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;

  <div class="cursor-badge" id="cursorBadge">€7.1K</div>

<script>
(function () {
  'use strict';

  const ANIM_DUR  = 2500;
  const HOLD_DUR  = 1500;
  const REV_START = 2.3;
  const REV_END   = 7.1;

  const line       = document.getElementById('lineP');
  const clipR      = document.getElementById('clipR');
  const dot        = document.getElementById('dotEl');
  const revEl      = document.getElementById('revNum');
  const card       = document.getElementById('cardWrap');
  const cursorLine = document.getElementById('cursorLine');
  const cursorBadge= document.getElementById('cursorBadge');

  const ease = p => 1 - Math.pow(1 - p, 3);

  let totalLen = 0;

  function initPath() {
    totalLen = line.getTotalLength();
    line.style.strokeDasharray  = totalLen;
    line.style.strokeDasharray  = totalLen;
    line.style.strokeDashoffset = totalLen;
    clipR.setAttribute('width', '0');
    const pt = line.getPointAtLength(0);
    dot.setAttribute('cx', pt.x);
    dot.setAttribute('cy', pt.y);
    revEl.textContent = REV_START.toFixed(1);
    cursorLine.style.opacity  = '0';
    cursorBadge.style.opacity = '0';
  }

  let rafId, holdTimer, startTs;

  function reset() {
    cancelAnimationFrame(rafId);
    clearTimeout(holdTimer);
    if (!totalLen) return;
    line.style.strokeDashoffset = totalLen;
    clipR.setAttribute('width', '0');
    const pt = line.getPointAtLength(0);
    dot.setAttribute('cx', pt.x);
    dot.setAttribute('cy', pt.y);
    revEl.textContent = REV_START.toFixed(1);
    /* Hide cursor elements on reset */
    cursorLine.style.opacity  = '0';
    cursorBadge.style.opacity = '0';
  }

  function animate(ts) {
    if (!startTs) startTs = ts;
    const rawP   = Math.min((ts - startTs) / ANIM_DUR, 1);
    const easedP = ease(rawP);

    /* Line draw */
    line.style.strokeDashoffset = totalLen * (1 - easedP);

    /* Dot follows path */
    const pt = line.getPointAtLength(easedP * totalLen);
    dot.setAttribute('cx', pt.x);
    dot.setAttribute('cy', pt.y);

    /* Fill clip follows dot x */
    clipR.setAttribute('width', pt.x + 6);

    /* Revenue counter synced with chart */
    const val = REV_START + easedP * (REV_END - REV_START);
    revEl.textContent = val.toFixed(1);

    if (rawP < 1) {
      rafId = requestAnimationFrame(animate);
    } else {
      revEl.textContent = REV_END.toFixed(1);
      /* Reveal cursor line and badge once dot lands */
      cursorLine.style.opacity  = '1';
      cursorBadge.style.opacity = '1';
      holdTimer = setTimeout(startCycle, HOLD_DUR);
    }
  }

  function startCycle() {
    startTs = null;
    reset();
    setTimeout(() => {
      rafId = requestAnimationFrame(animate);
    }, 60);
  }

  /* IntersectionObserver: start when visible */
  let running = false;
  const obs = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && !running) {
      running = true;
      initPath();
      startCycle();
    } else if (!entries[0].isIntersecting && running) {
      running = false;
      cancelAnimationFrame(rafId);
      clearTimeout(holdTimer);
    }
  }, { threshold: 0.4 });

  window.addEventListener('load', () => obs.observe(card));
})();
</script>
